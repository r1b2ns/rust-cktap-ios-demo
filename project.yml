name: CKTapDemo

options:
  bundleIdPrefix: zeroSixteen.br.com
  deploymentTarget:
    iOS: "26.4"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.4"

settings:
  base:
    DEVELOPMENT_TEAM: VVAVW2S9CF
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CKTap:
    path: ../rust-cktap/cktap-swift

targets:
  CKTapDemo:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: CKTapDemo
        excludes:
          - "Info.plist"
    info:
      path: CKTapDemo/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NFCReaderUsageDescription: This app uses NFC to communicate with your Tapsigner or SatsCard.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - F0436F696E6B697465434152447631
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: CKTapDemo
        PRODUCT_BUNDLE_IDENTIFIER: zeroSixteen.br.com.CKTapDemo
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CKTapDemo/CKTapDemo.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VVAVW2S9CF
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: CKTap
        product: CKTap

schemes:
  CKTapDemo:
    build:
      targets:
        CKTapDemo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
